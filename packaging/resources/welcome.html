<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;line-height:1.6;padding:12px}h1{font-size:22px}</style><body><h1>Compositor 简体中文</h1><p>基于 Compositor 1.4.8 的第三方简体中文补丁，由 urtinylee 发布。</p><p>这个安装器包含已编译的中文应用副本，适用于 macOS 26 及以上的 Apple silicon Mac。</p><p>安装位置：/Applications/Compositor 简体中文.app</p><p>原版 /Applications/Compositor.app 可继续使用。若已有此中文版，请先退出；安装会更新同名中文副本。</p></body></html>
