<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;line-height:1.6;padding:12px}h1{font-size:22px}</style><body><h1>安装说明</h1><p>不需要先安装原版，也不需要 Xcode、Python 或终端命令。点按“继续”，按系统提示完成安装。系统可能要求管理员密码。</p><p>本版应用采用 ad-hoc 本地签名；安装包未使用 Developer ID Installer 签名，未经过 Apple 公证。安装或首次启动可能被 macOS 拦截。请只在确认来源与文件完整性后，按 Apple 官方说明为此文件授权。</p><p>主要菜单、工具、面板和常用对话框为中文，少量提示可能仍为英文。此副本已关闭官方自动更新；后续版本需要重新安装对应汉化包。</p><p>MIT 许可证及原项目版权声明包含在应用资源和公开源码中。此项目不是原作者发布的官方中文版。</p></body></html>
